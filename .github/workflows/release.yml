name: Release Build

on:
  workflow_dispatch:

jobs:
  release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :security:testDebugUnitTest :core:testDebugUnitTest :data:testDebugUnitTest :domain:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify signed release APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Chameleon-LATEST.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-release-${{ github.ref_name }}
          path: Chameleon-LATEST.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Chameleon-LATEST.apk
          draft: true
          generate_release_notes: true
