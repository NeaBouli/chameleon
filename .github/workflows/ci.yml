name: Chameleon CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Root `check` runs every module's check task (unit tests, lint, detekt)
      # plus the mandatory guards verifyNoAppIfrWalletCode and
      # verifyNoClientSidePaidUnlock, which every module check depends on.
      - name: Root check (tests, lint, detekt, security guards)
        run: ./gradlew check
        continue-on-error: false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chameleon-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

  security-scan:
    name: Security Pattern Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No crypto outside stealthx-crypto
        run: |
          VIOLATIONS=$(grep -r "lazysodium\|LazySodium" \
            --include="*.kt" . \
            | grep -v "stealthx-crypto/" \
            | grep -v "build.gradle" \
            | grep -v "SECURECALL_ANALYSIS" \
            | grep -v "^Binary" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "CRYPTO VIOLATION:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No crypto violations"

      - name: No debug logs in crypto/security
        run: |
          VIOLATIONS=$(grep -rn "Log\.d\|Log\.v\|println" \
            --include="*.kt" \
            stealthx-crypto/src/main/ security/src/main/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "DEBUG LOG FOUND:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No debug logs in sensitive modules"

      - name: No plaintext MediaStore in privatezone
        run: |
          VIOLATIONS=$(grep -rn "MediaStore\|/DCIM/" \
            --include="*.kt" \
            features/privatezone/src/main/ \
            | grep -v "^.*//.*" \
            | grep -v "^\s*\*" \
            | grep -v ":[0-9]*:\s*\*" \
            | grep -v "test/" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "MEDIASTORE VIOLATION:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No MediaStore references in privatezone"
