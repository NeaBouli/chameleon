<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chameleon paid access</title>
<style>
:root{color-scheme:dark;--accent:#00ff88;--bg:#070910;--panel:#10141d;--text:#eef3f8;--muted:#a8b0bc}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(580px,100%);box-sizing:border-box;border:1px solid rgba(0,255,136,.25);border-radius:8px;background:var(--panel);padding:22px}
h1{margin:0 0 8px;color:var(--accent);font-size:clamp(28px,7vw,42px);line-height:1.05}
p{color:var(--muted);line-height:1.5}
a{display:block;padding:14px;margin-top:18px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-weight:800;text-align:center;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>Paid access is launch-gated</h1>
<p>Chameleon checkout and wallet verification are unavailable until product interoperability, signed entitlement, refund-revocation, and controlled test-mode checks pass.</p>
<a href="https://vlabs.gr/en/shop?focus=security">Check availability at VLABS</a>
</main>
</body>
</html>
